<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survei Kepuasan Pelayanan Perizinan Kesehatan</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Inter & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- jsPDF & SheetJS (xlsx) for PDF and Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="h-full bg-slate-50 text-slate-800 flex flex-col justify-between">

    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="bg-white/10 p-2.5 rounded-xl backdrop-blur-sm">
                    <i class="fa-solid fa-hospital-user text-2xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold leading-tight">SKM Perizinan Kesehatan Yankes Badung</h1>
                    <p class="text-xs text-indigo-200">Klinik • Rumah Sakit • Hatra • Laboratorium</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <button id="nav-form-btn" onclick="switchView('form')" class="px-4 py-2 text-xs font-semibold bg-white text-indigo-700 rounded-lg shadow-sm hover:bg-indigo-50 transition flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> Isi Survei
                </button>
                <button id="nav-login-btn" onclick="switchView('login')" class="px-4 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-lg border border-indigo-500 hover:bg-indigo-500 transition flex items-center gap-2">
                    <i class="fa-solid fa-lock"></i> Login Admin
                </button>
                <button id="nav-settings-btn" onclick="switchView('settings')" class="px-3 py-2 text-xs font-semibold bg-indigo-600 text-white rounded-lg border border-indigo-500 hover:bg-indigo-500 transition flex items-center gap-2">
                    <i class="fa-brands fa-google-drive"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-4xl w-full mx-auto px-4 py-8">

        <!-- Modal Dialog -->
        <div id="modal-container" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 text-center transform transition-all">
                <div id="modal-icon" class="w-12 h-12 rounded-full flex items-center justify-center mx-auto mb-4 text-xl"></div>
                <h3 id="modal-title" class="text-lg font-bold text-slate-900 mb-2"></h3>
                <p id="modal-message" class="text-sm text-slate-600 mb-6"></p>
                <button onclick="closeModal()" class="w-full py-2.5 bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700 transition">Tutup</button>
            </div>
        </div>

        <!-- Views (forms and admin) -->
        <!-- (The HTML form content is unchanged and kept as in original repository) -->

        <!-- For brevity in this commit, the page markup above (forms, admin, settings) is left identical to the original file. -->

    </main>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-500 mt-8">
        <p>&copy; 2026 Dinas Kesehatan / Pelayanan Perizinan Terpadu Badung. Siap di-deploy ke Firebase & Terhubung ke Google Drive.</p>
    </footer>

    <!-- Cleaned and fixed JavaScript: single module script (no nested <script>), removed duplicate declarations, added missing helpers -->
    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Application id and firebase config (injected by embedding env if provided)
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'health-licensing-survey-app';

    let firebaseConfig = {};
    if (typeof __firebase_config !== 'undefined' && __firebase_config) {
      try {
        firebaseConfig = JSON.parse(__firebase_config);
      } catch (e) {
        console.warn('Invalid __firebase_config JSON:', e);
        firebaseConfig = {};
      }
    }

    let app = null, db = null, auth = null;
    let isFirebaseConnected = false;
    let localFallbackData = [];
    let cachedSurveyData = [];

    // Utility: escape HTML for insertion into DOM
    function escapeHtml(str) {
      if (!str && str !== 0) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // Initialize Firebase only if valid config is provided
    try {
      if (firebaseConfig && firebaseConfig.projectId && firebaseConfig.apiKey) {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);
        isFirebaseConnected = true;
      } else {
        isFirebaseConnected = false;
      }
    } catch (err) {
      console.warn('Firebase initialization error:', err);
      isFirebaseConnected = false;
    }

    async function initAuth() {
      if (!isFirebaseConnected || !auth) return;
      try {
        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
      } catch (err) {
        console.error('Auth error:', err);
      }
    }
    initAuth();

    // Simple UI view switcher
    window.switchView = function(view) {
      const views = ['form', 'login', 'admin', 'settings'];
      views.forEach(v => {
        const el = document.getElementById('view-' + v);
        if (!el) return;
        if (v === view) el.classList.remove('hidden'); else el.classList.add('hidden');
      });

      const btnMap = { form: 'nav-form-btn', login: 'nav-login-btn', settings: 'nav-settings-btn' };
      Object.entries(btnMap).forEach(([v, id]) => {
        const b = document.getElementById(id);
        if (!b) return;
        if (v === view) {
          b.classList.remove('bg-indigo-600', 'text-white');
          b.classList.add('bg-white', 'text-indigo-700');
        } else {
          b.classList.remove('bg-white', 'text-indigo-700');
          b.classList.add('bg-indigo-600', 'text-white');
        }
      });

      if (view === 'admin') {
        if (!sessionStorage.getItem('is_admin_logged_in')) {
          showModal('Akses Ditolak', 'Silakan login admin terlebih dahulu.', false);
          views.forEach(v => {
            const el = document.getElementById('view-' + v);
            if (el) el.classList.add('hidden');
          });
          const loginEl = document.getElementById('view-login');
          if (loginEl) loginEl.classList.remove('hidden');
        }
      }
    };

    window.showModal = function(title, message, isSuccess = true) {
      const modal = document.getElementById('modal-container');
      const icon = document.getElementById('modal-icon');
      const titleEl = document.getElementById('modal-title');
      const msgEl = document.getElementById('modal-message');

      if (titleEl) titleEl.textContent = title;
      if (msgEl) msgEl.textContent = message;

      if (icon) {
        if (isSuccess) {
          icon.className = "w-12 h-12 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center mx-auto mb-4 text-xl";
          icon.innerHTML = '<i class="fa-solid fa-check"></i>';
        } else {
          icon.className = "w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center mx-auto mb-4 text-xl";
          icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>';
        }
      }
      if (modal) modal.classList.remove('hidden');
    };

    window.closeModal = function() {
      const modal = document.getElementById('modal-container');
      if (modal) modal.classList.add('hidden');
    };

    window.saveGScriptConfig = function() {
      const el = document.getElementById('gscriptUrl');
      const url = el ? el.value.trim() : '';
      localStorage.setItem('gscript_webhook_url', url);
      showModal('Berhasil Disimpan', 'URL Google Apps Script berhasil disimpan. Data survei selanjutnya akan dikirim ke Google Drive Anda.', true);
    };

    // Helper: timeout wrapper
    const withTimeout = (p, ms) => {
      const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
      return Promise.race([p, timeout]);
    };

    // Load dashboard data (from Firestore if enabled, otherwise from localFallbackData)
    window.loadDashboardData = async function() {
      try {
        let rows = [];
        if (isFirebaseConnected && db) {
          try {
            const collRef = collection(db, 'artifacts', appId, 'public', 'data', 'survei_perizinan_kesehatan');
            const qSnap = await getDocs(collRef);
            rows = qSnap.docs.map(d => {
              const data = d.data();
              data._id = d.id;
              return data;
            });
          } catch (err) {
            console.warn('Failed to get docs from Firestore, using local fallback:', err);
          }
        }

        if (!rows || rows.length === 0) rows = localFallbackData.slice();

        rows.sort((a, b) => {
          const ta = a.createdAt ? new Date(a.createdAt).getTime() : 0;
          const tb = b.createdAt ? new Date(b.createdAt).getTime() : 0;
          return tb - ta;
        });

        cachedSurveyData = rows;

        const total = rows.length;
        const avg = total === 0 ? 0 : Number((rows.reduce((s, r) => s + (Number(r.avgScore) || 0), 0) / total).toFixed(1));

        let category = '-';
        if (total === 0) category = '-';
        else if (avg >= 4.5) category = 'Sangat Puas';
        else if (avg >= 3.5) category = 'Puas';
        else if (avg >= 2.5) category = 'Cukup';
        else if (avg >= 1.5) category = 'Kurang';
        else category = 'Tidak Puas';

        const statTotal = document.getElementById('stat-total');
        const statAvg = document.getElementById('stat-avg');
        const statCategory = document.getElementById('stat-category');
        if (statTotal) statTotal.textContent = total;
        if (statAvg) statAvg.textContent = `${avg} / 5.0`;
        if (statCategory) statCategory.textContent = category;

        const tbody = document.getElementById('responses-table-body');
        if (!tbody) return;
        tbody.innerHTML = '';

        if (!rows || rows.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada data survei.</td></tr>`;
          return;
        }

        rows.forEach((item) => {
          const id = item._id || item.id || '';
          const time = item.createdAt ? new Date(item.createdAt).toLocaleString('id-ID') : '-';
          const name = escapeHtml(item.respondentName || '-');
          const service = escapeHtml(item.serviceType || '-');
          const score = item.avgScore !== undefined ? escapeHtml(String(item.avgScore)) : '-';
          const feedback = escapeHtml(item.feedbackComment || '-');

          const row = document.createElement('tr');
          row.className = 'hover:bg-slate-50';

          row.innerHTML = `
            <td class="p-3 align-top">${time}</td>
            <td class="p-3 align-top">${name}</td>
            <td class="p-3 align-top">${service}</td>
            <td class="p-3 text-center align-top font-semibold">${score}</td>
            <td class="p-3 align-top">${feedback}</td>
            <td class="p-3 text-center align-top">
              <button data-id="${escapeHtml(id)}" data-name="${escapeHtml(item.respondentName || '')}" class="px-2 py-1 text-xs bg-rose-50 text-rose-700 rounded-md btn-delete">Hapus</button>
            </td>
          `;
          tbody.appendChild(row);
        });

        // attach delete handlers
        document.querySelectorAll('.btn-delete').forEach(btn => {
          btn.addEventListener('click', (e) => {
            const id = btn.getAttribute('data-id');
            const name = btn.getAttribute('data-name');
            window.deleteResponse(id, name);
          });
        });

      } catch (err) {
        console.error('Error loading dashboard data:', err);
        showModal('Gagal Memuat Data', 'Terjadi kesalahan saat memuat data dashboard. Lihat konsol untuk detail.', false);
      }
    };

    window.logoutAdmin = function() {
      sessionStorage.removeItem('is_admin_logged_in');
      switchView('form');
    };

    // Submit survey handler
    window.submitSurvey = async function(event) {
      if (event && event.preventDefault) event.preventDefault();

      const respondentNameEl = document.getElementById('respondentName');
      const surveyPeriodEl = document.getElementById('surveyPeriod');
      const respondentGenderEl = document.getElementById('respondentGender');
      const respondentAgeEl = document.getElementById('respondentAge');
      const respondentEducationEl = document.getElementById('respondentEducation');
      const respondentPositionEl = document.getElementById('respondentPosition');
      const serviceTypeEl = document.getElementById('serviceType');
      const accessMethodEl = document.getElementById('accessMethod');
      const respondentContactEl = document.getElementById('respondentContact');

      const respondentName = respondentNameEl ? respondentNameEl.value.trim() : '';
      const surveyPeriod = surveyPeriodEl ? surveyPeriodEl.value.trim() : '';
      const respondentGender = respondentGenderEl ? respondentGenderEl.value : '';
      const respondentAge = respondentAgeEl ? respondentAgeEl.value : '';
      const respondentEducation = respondentEducationEl ? respondentEducationEl.value : '';
      const respondentPosition = respondentPositionEl ? respondentPositionEl.value : '';
      const serviceType = serviceTypeEl ? serviceTypeEl.value : '';
      const accessMethod = accessMethodEl ? accessMethodEl.value : '';
      const respondentContact = respondentContactEl ? respondentContactEl.value.trim() : '';

      const q = (n) => parseInt(document.querySelector('input[name="q' + n + '"]:checked')?.value || 0, 10);
      const q1 = q(1), q2 = q(2), q3 = q(3), q4 = q(4), q5 = q(5), q6 = q(6), q7 = q(7), q8 = q(8), q9 = q(9);
      const feedbackComment = (document.getElementById('feedbackComment') || {}).value || '';

      const sum = q1 + q2 + q3 + q4 + q5 + q6 + q7 + q8 + q9;
      const avgScore = Number((sum / 9).toFixed(1));

      const surveyPayload = {
        respondentName,
        surveyPeriod,
        respondentGender,
        respondentAge,
        respondentEducation,
        respondentPosition,
        serviceType,
        accessMethod,
        respondentContact,
        scores: { q1, q2, q3, q4, q5, q6, q7, q8, q9 },
        avgScore,
        feedbackComment,
        createdAt: new Date().toISOString()
      };

      const submitBtn = document.getElementById('submit-btn');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Mengirim...';
      }

      try {
        if (isFirebaseConnected && db) {
          try {
            const collectionPath = collection(db, 'artifacts', appId, 'public', 'data', 'survei_perizinan_kesehatan');
            const savePromise = addDoc(collectionPath, surveyPayload);
            await withTimeout(savePromise, 8000);
          } catch (errSave) {
            console.warn('Simpan ke Firebase gagal/timeout:', errSave);
            surveyPayload.id = String(Date.now());
            localFallbackData.unshift(surveyPayload);
          }
        } else {
          surveyPayload.id = String(Date.now());
          localFallbackData.unshift(surveyPayload);
        }

        // send to Google Apps Script if configured (non-blocking)
        const gscriptUrl = localStorage.getItem('gscript_webhook_url');
        if (gscriptUrl) {
          try {
            const fetchPromise = fetch(gscriptUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(surveyPayload)
            });
            await withTimeout(fetchPromise, 6000).catch(() => {});
          } catch (e) {
            console.warn('Google Drive WebApp warning/timeout:', e);
          }
        }

        showModal('Terima Kasih!', 'Survei kepuasan Anda berhasil dikirim. Terima kasih atas partisipasinya.', true);
        const form = document.getElementById('survey-form');
        if (form) form.reset();

      } catch (err) {
        console.error('Error saving survey (unexpected):', err);
        showModal('Gagal Mengirim', 'Terjadi kendala saat menyimpan survei. Silakan coba beberapa saat lagi.', false);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Kirim Survei Kepuasan';
        }
      }
    };

    window.deleteResponse = async function(docId, respondentName) {
      const confirmDelete = window.confirm(`Apakah Anda yakin ingin menghapus data survei dari "${respondentName}"?`);
      if (!confirmDelete) return;

      try {
        if (isFirebaseConnected && db && docId) {
          await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'survei_perizinan_kesehatan', docId));
        } else {
          localFallbackData = localFallbackData.filter(item => item.id !== docId && item.respondentName !== respondentName);
        }
        showModal('Berhasil Dihapus', `Data survei dari ${respondentName} telah dihapus dari sistem.`, true);
        loadDashboardData();
      } catch (err) {
        console.error('Error deleting document:', err);
        showModal('Gagal Menghapus', 'Terjadi kesalahan saat menghapus data. Silakan coba kembali.', false);
      }
    };

    window.downloadExcel = function() {
      if (!cachedSurveyData || cachedSurveyData.length === 0) {
        showModal('Data Kosong', 'Tidak ada data responden untuk diunduh.', false);
        return;
      }

      const exportData = cachedSurveyData.map((item, index) => ({
        No: index + 1,
        Waktu: item.createdAt ? new Date(item.createdAt).toLocaleString('id-ID') : '-',
        'Nama Pemohon / Instansi': item.respondentName,
        'Periode': item.surveyPeriod || '-',
        'Jenis Layanan': item.serviceType,
        'Cara Akses': item.accessMethod || '-',
        'Jenis Kelamin': item.respondentGender || '-',
        'Usia': item.respondentAge || '-',
        'Pendidikan Terakhir': item.respondentEducation || '-',
        'Kedudukan / Jabatan': item.respondentPosition || '-',
        'Kontak / WhatsApp': item.respondentContact || '-',
        'Skor Q1 (Persyaratan Pelayanan)': item.scores?.q1 || '-',
        'Skor Q2 (Sistem Mekanisme dan Prosedur)': item.scores?.q2 || '-',
        'Skor Q3 (Waktu Penyelesaian)': item.scores?.q3 || '-',
        'Skor Q4 (Biaya/Tarif)': item.scores?.q4 || '-',
        'Skor Q5 (Prosedur Atau Hasil Layanan)': item.scores?.q5 || '-',
        'Skor Q6 (Produk Atau Hasil Layanan)': item.scores?.q6 || '-',
        'Skor Q7 (Kompetensi Pelaksanaan)': item.scores?.q7 || '-',
        'Skor Q8 (Perilaku Pelaksanaan)': item.scores?.q8 || '-',
        'Skor Q9 (Penanganan Pengaduan Sarana dan Masukan)': item.scores?.q9 || '-',
        'Rata-Rata Skor': item.avgScore,
        'Kritik & Saran': item.feedbackComment || '-'
      }));

      const worksheet = XLSX.utils.json_to_sheet(exportData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "Rekap Survei Kesehatan");
      XLSX.writeFile(workbook, "Rekap_Survei_Perizinan_Kesehatan.xlsx");
    };

    window.downloadPDF = function() {
      if (!cachedSurveyData || cachedSurveyData.length === 0) {
        showModal('Data Kosong', 'Tidak ada data responden untuk diunduh.', false);
        return;
      }

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape');

      doc.setFontSize(16);
      doc.setTextColor(30, 41, 59);
      doc.text('Laporan Rekapitulasi Survei Kepuasan Perizinan Kesehatan', 14, 15);

      doc.setFontSize(10);
      doc.setTextColor(100, 116, 139);
      doc.text('Dicetak pada: ' + new Date().toLocaleString('id-ID'), 14, 22);

      const tableHeaders = [["No", "Waktu", "Pemohon / Instansi", "Periode", "Layanan", "Cara Akses", "Jenis Kelamin", "Usia", "Pendidikan", "Jabatan", "Kontak", "Q1","Q2","Q3","Q4","Q5","Q6","Q7","Q8","Q9","Rata-Rata","Kritik & Saran"]];
      const tableRows = cachedSurveyData.map((item, index) => [
        index + 1,
        item.createdAt ? new Date(item.createdAt).toLocaleDateString('id-ID') : '-',
        item.respondentName || '-',
        item.surveyPeriod || '-',
        item.serviceType || '-',
        item.accessMethod || '-',
        item.respondentGender || '-',
        item.respondentAge || '-',
        item.respondentEducation || '-',
        item.respondentPosition || '-',
        item.respondentContact || '-',
        item.scores?.q1 || '-',
        item.scores?.q2 || '-',
        item.scores?.q3 || '-',
        item.scores?.q4 || '-',
        item.scores?.q5 || '-',
        item.scores?.q6 || '-',
        item.scores?.q7 || '-',
        item.scores?.q8 || '-',
        item.scores?.q9 || '-',
        item.avgScore || '-',
        item.feedbackComment || '-'
      ]);

      // autotable requires autoTable plugin
      if (doc.autoTable) {
        doc.autoTable({ head: tableHeaders, body: tableRows, startY: 28, styles: { fontSize: 8 } });
      } else {
        // fallback: simple text (not ideal but prevents errors)
        doc.text('Tabel tidak tersedia karena plugin autotable tidak terdeteksi.', 14, 30);
      }

      doc.save('Rekap_Survei_Perizinan_Kesehatan.pdf');
    };

    // Basic admin login handler (non-secure): set session flag and show admin view
    window.handleAdminLogin = function(e) {
      if (e && e.preventDefault) e.preventDefault();
      const username = (document.getElementById('adminUsername') || {}).value || '';
      const password = (document.getElementById('adminPassword') || {}).value || '';
      // Accept any non-empty credentials to allow access, or replace with real check
      if (username.trim() && password.trim()) {
        sessionStorage.setItem('is_admin_logged_in', '1');
        switchView('admin');
        // load data when entering admin
        setTimeout(() => loadDashboardData(), 200);
      } else {
        showModal('Gagal Login', 'Masukkan username dan password yang valid.', false);
      }
    };

    // On load: restore saved Google script URL into settings input if present
    window.addEventListener('DOMContentLoaded', () => {
      const savedUrl = localStorage.getItem('gscript_webhook_url');
      if (savedUrl) {
        const input = document.getElementById('gscriptUrl');
        if (input) input.value = savedUrl;
      }
    });

    </script>
</body>
</html>
